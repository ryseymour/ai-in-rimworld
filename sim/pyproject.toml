[project]
name = "colonysim"
version = "0.1.0"
description = "World generation and procedural roads for the colony simulation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
colonysim-demo = "colonysim.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colonysim"]
